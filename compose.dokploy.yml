services:
  telegram-bot-api:
    image: YOUR_DOCKERHUB_USERNAME/telegram-bot-api:10.4
    pull_policy: always
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    networks:
      - dokploy-network

volumes:
  telegram-data:

networks:
  dokploy-network:
    external: true
